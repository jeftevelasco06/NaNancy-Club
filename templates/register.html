{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper">
  <div class="card auth-card p-4">
    <h3>Registrarse</h3>
    <form method="POST" action="{{ url_for('register') }}">
      <div class="mb-3">
        <label class="form-label">Correo</label>
        <input type="email" name="email" required class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" required class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Confirmar contraseña</label>
        <input type="password" name="confirm" required class="form-control">
      </div>

      <div class="mb-3">
        <label class="form-label">Número de teléfono</label>
        <input type="tel" name="phone" class="form-control" placeholder="5213312345678">
      </div>

      <div class="mb-3">
        <label class="form-label">Ubicación (opcional)</label>
        <input type="text" name="location" class="form-control">
      </div>

      <div class="d-grid">
        <button class="btn btn-primary">Registrarme</button>
      </div>
      <div class="mt-3 small">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></div>
    </form>
  </div>
</div>
{% endblock %}
